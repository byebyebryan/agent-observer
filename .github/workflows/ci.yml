name: Independent Observer checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install operational fixture tool
        run: |
          curl -fsSL --retry 3 https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/observer-tools"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/observer-tools" chezmoi
          echo "$RUNNER_TEMP/observer-tools" >> "$GITHUB_PATH"
      - run: python -m pip install '.[dev]'
      - run: ./scripts/check
      - run: ruff check agent_observer tests scripts/check scripts/check-mesh-release scripts/candidate-artifact
  mesh-a23-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install operational fixture tool
        run: |
          curl -fsSL --retry 3 https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/observer-tools"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/observer-tools" chezmoi
          echo "$RUNNER_TEMP/observer-tools" >> "$GITHUB_PATH"
      - name: Install published legacy full-view SDK wheel
        run: python -m pip install '.[dev]' 'mesh-plus @ https://github.com/byebyebryan/mesh-plus/releases/download/v0.1.0a23/mesh_plus-0.1.0a23-py3-none-any.whl#sha256=73455186e187198c8e44b6ae6c381926809931a176f17614864141c62ff850c2'
      - run: ./scripts/check
      - run: ./scripts/check-mesh-owner --installed
  working-set-pair:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install operational fixture tool
        run: |
          curl -fsSL --retry 3 https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/observer-tools"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/observer-tools" chezmoi
          echo "$RUNNER_TEMP/observer-tools" >> "$GITHUB_PATH"
      - name: Download exact published Mesh a24 wheel
        run: python -m pip download --no-deps --dest "$RUNNER_TEMP" 'mesh-plus @ https://github.com/byebyebryan/mesh-plus/releases/download/v0.1.0a24/mesh_plus-0.1.0a24-py3-none-any.whl#sha256=9bca5b554babfa59ba56b1a4ac5e8e5c66a85e63709731ee1fe7d4f0ed6a18a6'
      - name: Install Observer development tools and the downloaded wheel
        run: python -m pip install '.[dev]' "$RUNNER_TEMP/mesh_plus-0.1.0a24-py3-none-any.whl"
      - name: Verify installed Mesh against its release manifest
        run: python -I -B scripts/check-mesh-release --prefix "$(python -c 'import sys; print(sys.prefix)')" --manifest artifacts/mesh-0.1.0a24.json --wheel "$RUNNER_TEMP/mesh_plus-0.1.0a24-py3-none-any.whl"
      - run: ./scripts/check --require-working-set-mesh
      - run: ./scripts/check-mesh-owner --installed
