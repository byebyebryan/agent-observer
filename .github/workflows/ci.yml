name: Independent Observer checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install operational fixture tool
        run: |
          curl -fsSL --retry 3 https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/observer-tools"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/observer-tools" chezmoi
          echo "$RUNNER_TEMP/observer-tools" >> "$GITHUB_PATH"
      - run: python -m pip install '.[dev]'
      - run: ./scripts/check
      - run: ruff check scripts/candidate-artifact tests/test_candidate_artifact.py
  mesh-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install operational fixture tool
        run: |
          curl -fsSL --retry 3 https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/observer-tools"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/observer-tools" chezmoi
          echo "$RUNNER_TEMP/observer-tools" >> "$GITHUB_PATH"
      - name: Install qualified Agent v3 prepared SDK source
        run: python -m pip install '.[dev]' 'mesh-plus @ git+https://github.com/byebyebryan/mesh-plus.git@37c3e01c36866b73734b6ec28d3b7686012c90c0'
      - run: ./scripts/check
      - run: ./scripts/check-mesh-owner --installed
  mesh-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install operational fixture tool
        run: |
          curl -fsSL --retry 3 https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/observer-tools"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/observer-tools" chezmoi
          echo "$RUNNER_TEMP/observer-tools" >> "$GITHUB_PATH"
      - name: Install accepted Agent v3 publisher SDK source
        run: python -m pip install '.[dev]' 'mesh-plus @ git+https://github.com/byebyebryan/mesh-plus.git@ad3c256fef463396481ff6fd7acfac76d2ca4eb0'
      - run: ./scripts/check
      - run: ./scripts/check-mesh-owner --installed
