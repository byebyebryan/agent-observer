name: Independent Observer checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: ./scripts/check
      - run: ruff check scripts/candidate-artifact tests/test_candidate_artifact.py
  mesh-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]' 'mesh-plus @ https://github.com/byebyebryan/mesh-plus/releases/download/v0.1.0a9/mesh_plus-0.1.0a9-py3-none-any.whl#sha256=07882909a49cd513b5c114da7890bebfe9b1592da3a08cca69a68c24817164c2'
      - run: ./scripts/check
