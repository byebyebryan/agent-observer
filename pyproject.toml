[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observer"
dynamic = ["version"]
description = "Passive host-local Codex and Claude Code session observations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
claude-history = ["claude-agent-sdk==0.2.163"]
dev = ["ruff==0.16.3"]

[project.scripts]
agent-observer = "agent_observer.cli:main"
agent-observer-write = "agent_observer.write_client:main"
agent-observer-service = "agent_observer.service_cli:serve"

[tool.setuptools.packages.find]
include = ["agent_observer*"]

[tool.setuptools.dynamic]
version = { attr = "agent_observer.__version__" }

[tool.setuptools.package-data]
agent_observer = ["contracts/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
